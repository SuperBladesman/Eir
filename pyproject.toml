[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "eir-bvs"
version = "2.1.0"
description = "Bond valence screening of crystal structures, with an integrity verdict"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nik Reeves-McLaren" }]
requires-python = ">=3.11"
keywords = ["crystallography", "bond valence sum", "global instability index",
            "crystal structure validation", "CIF", "ICSD", "Rietveld", "data integrity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "gemmi>=0.6.5",
    "PyCifRW>=4.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "ipython>=8",
    "joblib>=1.3",
    "psutil>=5.9",
]

[project.optional-dependencies]
viz = ["py3Dmol>=2.0"]
test = ["pytest>=7"]

[project.scripts]
eir = "eir.cli:main"

[project.urls]
Homepage = "https://github.com/SuperBladesman/Eir"
Paper = "https://doi.org/10.1039/D5DT03003J"
Issues = "https://github.com/SuperBladesman/Eir/issues"
Changelog = "https://github.com/SuperBladesman/Eir/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/eir"]

# The reference tables live in Data/ at the top of the repository, where the
# notebook reads them; the wheel carries a copy as eir/data.
[tool.hatch.build.targets.wheel.force-include]
"Data" = "eir/data"

[tool.hatch.build.targets.sdist]
include = ["src/eir", "Data", "tests", "examples", "tools", "README.md",
           "LICENSE", "CHANGELOG.md", "CITATION.cff", "Eir.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
